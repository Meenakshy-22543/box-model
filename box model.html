<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .outer-box {
            border: 5px solid black;
            padding: 30px;
            width: 350px;
            margin: 50px auto;
        }

        .middle-box {
            border: 4px solid blue;
            padding: 25px;
        }

        .inner-box {
            border: 3px solid red;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="outer-box">
        <div class="middle-box">
            <div class="inner-box">
                Inner Box
            </div>
        </div>
    </div>

</body>
</html>
